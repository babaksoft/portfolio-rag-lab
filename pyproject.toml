[build-system]
requires = ["uv_build>=0.12.7,<0.14.0"]
build-backend = "uv_build"

[project]
name = "portfolio-rag-lab"
version = "0.1.0"
description = "An evaluated progression from deterministic to bounded agentic retrieval."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "streamlit>=1.41,<2",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.uv.build-backend]
module-name = "portfolio_rag"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ANN", "B", "D", "E4", "E7", "E9", "F", "I", "N", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
  "--strict-config",
  "--strict-markers",
  "-ra",
]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "integration: requires the isolated PostgreSQL service configured by the caller",
]
